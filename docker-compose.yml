
services:
  # 1. Redis Cache para sessões da Evolution API
  redis:
    image: redis:7-alpine
    container_name: victor_cell_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - bot_network

  # 2. Gateway do WhatsApp (Evolution API v2 - Porta 8085 para evitar conflitos na VM)
  evolution-api:
    image: evoapicloud/evolution-api:v2.2.0
    container_name: victor_cell_evolution
    restart: unless-stopped
    ports:
      - "${PORT_EVOLUTION:-8085}:8080"
    environment:
      - SERVER_URL=http://localhost:${PORT_EVOLUTION:-8085}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-ChaveSecretaLoja123}
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      - WEBHOOK_GLOBAL_URL=http://pecas-backend:8000/webhook
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - redis
    networks:
      - bot_network

  # 3. Backend Python (FastAPI + Gemini + Google Sheets + Power BI Dashboard - Porta 8005)
  pecas-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: victor_cell_backend
    restart: unless-stopped
    ports:
      - "${PORT_BACKEND:-8005}:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
      - GOOGLE_SHEETS_API_KEY=${GOOGLE_SHEETS_API_KEY}
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-ChaveSecretaLoja123}
      - EVOLUTION_INSTANCE_NAME=${EVOLUTION_INSTANCE_NAME:-victor-cell-01}
      - STAFF_PHONES=${STAFF_PHONES:-5585999999999}
      - STORE_TIMEZONE=America/Fortaleza
      - STORE_OPENING_TIME=08:30
      - STORE_CLOSING_TIME=18:00
      - STORE_SAT_CLOSING_TIME=13:00
      - DATABASE_PATH=/app/data/pecasbot.db
    volumes:
      - ./data:/app/data
    depends_on:
      - evolution-api
    networks:
      - bot_network

volumes:
  redis_data:
  evolution_instances:

networks:
  bot_network:
    driver: bridge
