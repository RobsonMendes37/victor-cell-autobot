name: Deploy PecasBot na Oracle VM

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Permite disparar o deploy manualmente pelo botão no GitHub

jobs:
  backend-quality-gate:
    name: Backend Quality Gate (Python, Ruff, Mypy, Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Ruff Linting & Formatação
        run: |
          python -m ruff check .

      - name: 2. Mypy Verificação Estática de Tipagem
        run: |
          python -m mypy --config-file pyproject.toml domain application infrastructure presentation

      - name: 3. Pytest Suíte Completa de Testes
        env:
          GEMINI_API_KEY: "demo_test_key"
        run: |
          python -m pytest tests/ -v

  frontend-quality-gate:
    name: Frontend Quality Gate (TypeScript, ESLint, Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar Dependências Front-End
        run: |
          npm ci

      - name: 4. TypeScript Checagem Estrita de Tipos
        run: |
          npm run typecheck

      - name: 5. ESLint Análise de Boas Práticas
        run: |
          npm run lint

      - name: 6. Vitest Testes Unitários de Interface
        run: |
          npm run test

  deploy:
    name: Deploy na Oracle Cloud VM
    needs: [backend-quality-gate, frontend-quality-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Conectar na VM e Subir Containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "🚀 Iniciando Deploy do PecasBot na VM..."

            # 1. Definir diretório do projeto na VM
            PROJECT_DIR="${{ secrets.VM_PROJECT_DIR || '~/pecasbot-api' }}"
            eval PROJECT_DIR=$PROJECT_DIR

            if [ ! -d "$PROJECT_DIR" ]; then
              echo "Pasta não encontrada, clonando repositório..."
              git clone https://github.com/${{ github.repository }}.git "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"

            # 2. Atualizar código pelo Git
            echo "📥 Atualizando código fonte da branch main..."
            git fetch --all
            git reset --hard origin/main

            # 3. Atualizar o arquivo .env se fornecido no GitHub Secrets
            if [ -n "${{ secrets.ENV_FILE }}" ]; then
              echo "🔒 Atualizando arquivo .env com segredos seguros..."
              echo "${{ secrets.ENV_FILE }}" > .env
              chmod 600 .env
            fi

            # 4. Reconstruir e subir os containers Docker
            echo "🐳 Subindo containers via Docker Compose..."
            docker compose down --remove-orphans || true
            docker compose up -d --build

            # 5. Limpar imagens antigas sem uso para economizar disco na VM
            docker image prune -f

            # 6. Checar status dos containers
            echo "✅ Status dos containers após deploy:"
            docker compose ps
