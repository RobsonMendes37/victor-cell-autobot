# ==============================================================================
# SonarQube & SonarCloud Configuration
# Victor Cell Enterprise - PecasBot API & Dashboard
# ==============================================================================

# Project Identification
sonar.projectKey=victor-cell-pecasbot
sonar.projectName=Victor Cell - PecasBot API & Dashboard
sonar.projectVersion=1.0.0

# Source & Test Codepaths
sonar.sources=domain,application,infrastructure,presentation,frontend/src
sonar.tests=tests,frontend/src
sonar.test.inclusions=tests/**,frontend/src/**/*.test.ts
sonar.exclusions=**/__pycache__/**,node_modules/**,.venv/**,data/**,tests/**,**/*.test.ts,presentation/static/vendor/**,data/backups/**,*.db,*.sqlite*,*.gz

# Encoding
sonar.sourceEncoding=UTF-8

# Python Analysis & Coverage
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml

# JavaScript & TypeScript Analysis & Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
